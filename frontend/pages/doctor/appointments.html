<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Appointments | HMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../assets/css/fonts.css" rel="stylesheet">
    <link href="../../assets/css/theme.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .sidebar { min-height: 100vh; background: #0f172a; color: #fff; }
        .sidebar .nav-link { color: rgba(255,255,255,0.7); padding: 12px 20px; margin-bottom: 4px; border-radius: 8px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #2563eb; color: #fff; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar px-3 py-4 d-flex flex-column justify-content-between">
            <div>
                <h5 class="fw-bold ps-3 mb-4">🏥 HMS Doctor</h5>
                <ul class="nav flex-column">
                    <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="bi bi-grid-fill me-2"></i> Dashboard</a></li>
                    <li class="nav-item"><a href="appointments.html" class="nav-link active"><i class="bi bi-calendar-check me-2"></i> Appointments</a></li>
                    <li class="nav-item"><a href="my_patients.html" class="nav-link"><i class="bi bi-people me-2"></i> Patient Directory</a></li>
                    <li class="nav-item"><a href="reports.html" class="nav-link"><i class="bi bi-clipboard-data me-2"></i> Reports</a></li>
                </ul>
            </div>
            <button onclick="logout()" class="btn text-danger fw-bold text-start w-100"><i class="bi bi-box-arrow-right me-2"></i> Logout</button>
        </div>

        <main class="col-md-10 bg-light p-4">
            <h4 class="fw-bold mb-4">My Appointments</h4>
            <div class="alert alert-info">Scheduled appointments assigned to you.</div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th class="ps-4">Patient</th>
                                <th>Scheduled</th>
                                <th>Status</th>
                                <th>Reason</th>
                                <th>Notes</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="appointmentTable">
                            <tr><td colspan="6" class="text-center py-4">Checking...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Clinical Notes Modal -->
<div class="modal fade" id="clinicalNotesModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Clinical Notes</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="clinicalNotesInput" class="form-label">Notes (required to complete)</label>
                    <textarea id="clinicalNotesInput" class="form-control" rows="5" placeholder="Enter clinical notes..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-success" onclick="submitClinicalNotes()">Save & Complete</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/app.js"></script>
<script>
    protectPage(['doctor', 'admin']);

    let pendingCompleteId = null;
    let clinicalModal = null;

    document.addEventListener("DOMContentLoaded", async () => {
        const tbody = document.getElementById('appointmentTable');
        clinicalModal = new bootstrap.Modal(document.getElementById('clinicalNotesModal'));

        // Fetch appointments assigned to this doctor
        const appointments = await Api.get('/doctor/appointments');
        tbody.innerHTML = '';

        if (appointments && appointments.length > 0) {
            appointments.forEach(a => {
                const when = a.scheduled_at ? new Date(a.scheduled_at) : null;
                const whenLabel = when ? when.toLocaleString() : 'N/A';
                const status = (a.status || 'scheduled').toLowerCase();
                const statusKey = status.replace(/\s+/g, '_');
                const statusClass = statusKey === 'checked_in' ? 'bg-success'
                    : statusKey === 'cancelled' ? 'bg-danger'
                    : statusKey === 'completed' ? 'bg-secondary'
                    : 'bg-primary';
                let actionHtml = '-';
                if (statusKey === 'scheduled' || statusKey === 'confirmed' || statusKey === 'pending') {
                    actionHtml = `<button class="btn btn-sm btn-primary" onclick="updateAppointmentStatus(${a.id}, 'checked_in')">Start Consult</button>`;
                } else if (statusKey === 'checked_in') {
                    actionHtml = `<button class="btn btn-sm btn-success" onclick="openClinicalNotes(${a.id})">Mark Completed</button>`;
                }
                tbody.innerHTML += `
                    <tr>
                        <td class="ps-4 fw-bold text-primary">${a.full_name}</td>
                        <td>${whenLabel}</td>
                        <td><span class="badge ${statusClass} text-uppercase">${statusKey.replace('_',' ')}</span></td>
                        <td>${a.reason || '-'}</td>
                        <td>${a.notes || '-'}</td>
                        <td>${actionHtml}</td>
                    </tr>
                `;
            });
        } else {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center p-4">No appointments found.</td></tr>';
        }
    });

    function openClinicalNotes(appointmentId) {
        pendingCompleteId = appointmentId;
        const notesInput = document.getElementById('clinicalNotesInput');
        notesInput.value = '';
        clinicalModal.show();
    }

    async function submitClinicalNotes() {
        const notesInput = document.getElementById('clinicalNotesInput');
        const notes = (notesInput.value || '').trim();
        if (!notes) {
            alert('Clinical notes are required to complete the appointment.');
            return;
        }
        const res = await Api.post('/doctor/appointment_update', {
            appointment_id: pendingCompleteId,
            status: 'completed',
            notes
        });
        if (res) {
            clinicalModal.hide();
            location.reload();
        }
    }

    async function updateAppointmentStatus(appointmentId, status) {
        const label = status.replace('_', ' ');
        if (!confirm(`Set status to "${label}"?`)) return;
        const res = await Api.post('/doctor/appointment_update', { appointment_id: appointmentId, status });
        if (res) {
            location.reload();
        }
    }
</script>
</body>
</html>
