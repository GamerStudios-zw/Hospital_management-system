<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Active Visits | HMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../assets/css/theme.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .sidebar { min-height: 100vh; background: #0f172a; color: #fff; }
        .sidebar .nav-link { color: rgba(255,255,255,0.7); padding: 12px 20px; margin-bottom: 4px; border-radius: 8px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #2563eb; color: #fff; }
    </style>
</head>
<body>

<div class="topbar">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    <div><i class="bi bi-telephone me-2"></i>+263 77 425 1433</div>
    <div><i class="bi bi-envelope me-2"></i>support@hms.local</div>
  </div>
</div>
<header class="header">
  <div class="container-fluid d-flex align-items-center justify-content-between">
    <a class="logo" href="/Hospital_Management_System/frontend/index.html"><i class="bi bi-hospital"></i> HMS</a>
  </div>
</header>


<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar px-3 py-4 d-flex flex-column justify-content-between">
            <div>
                <h5 class="fw-bold ps-3 mb-4">🏥 HMS Doctor</h5>
                <ul class="nav flex-column">
                    <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="bi bi-grid-fill me-2"></i> Dashboard</a></li>
                    <li class="nav-item"><a href="appointments.html" class="nav-link active"><i class="bi bi-calendar-check me-2"></i> Active Visits</a></li>
                    <li class="nav-item"><a href="my_patients.html" class="nav-link"><i class="bi bi-people me-2"></i> Patient Directory</a></li>
                    <li class="nav-item"><a href="reports.html" class="nav-link"><i class="bi bi-clipboard-data me-2"></i> Reports</a></li>
                </ul>
            </div>
            <button onclick="logout()" class="btn text-danger fw-bold text-start w-100"><i class="bi bi-box-arrow-right me-2"></i> Logout</button>
        </div>

        <main class="col-md-10 bg-light p-4">
            <h4 class="fw-bold mb-4">Ongoing Consultations</h4>
            <div class="alert alert-info">These are patients currently assigned to you (Status: With Doctor).</div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th class="ps-4">Patient Name</th>
                                <th>Queue ID</th>
                                <th>Vitals</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="activeTable">
                            <tr><td colspan="5" class="text-center py-4">Checking...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/app.js"></script>
<script>
    protectPage(['doctor', 'admin']);

    document.addEventListener("DOMContentLoaded", async () => {
        const tbody = document.getElementById('activeTable');

        // Fetch Patients marked as 'With Doctor'
        const patients = await Api.get('/doctor/my_patients');
        tbody.innerHTML = '';

        if (patients && patients.length > 0) {
            patients.forEach(p => {
                const vitals = `BP: ${p.blood_pressure || 'N/A'}`;
                tbody.innerHTML += `
                    <tr>
                        <td class="ps-4 fw-bold text-primary">${p.full_name}</td>
                        <td>#${p.queue_id}</td>
                        <td>${vitals}</td>
                        <td><span class="badge bg-success">In Progress</span></td>
                        <td>
                            <button class="btn btn-sm btn-success" onclick="completeVisit(${p.queue_id})">
                                Finish & Prescribe
                            </button>
                        </td>
                    </tr>
                `;
            });
        } else {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center p-4">No active consultations found.</td></tr>';
        }
    });

    async function completeVisit(qid) {
        if(confirm("Complete this visit?")) {
            await Api.post('/doctor/complete', { queue_id: qid });
            alert("Visit Completed.");
            location.reload();
        }
    }
</script>
</body>
</html>
