<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pharmacy | Hospital Management System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f7fb;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        .queue-item {
            cursor: pointer;
            transition: background 0.2s;
        }

        .queue-item:hover {
            background: #eef4ff;
        }

        .readonly {
            background-color: #e9ecef;
        }

        .status-badge {
            font-size: 0.8rem;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            #printSection, #printSection * {
                visibility: visible;
            }
            #printSection {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
            }
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-warning px-3 d-flex justify-content-between">
    <span class="navbar-brand text-dark">
        <i class="bi bi-capsule"></i> Pharmacy Module
    </span>
    <span class="text-dark fw-bold">Pharmacist</span>
</nav>

<div class="container-fluid p-4">
    <div class="row">

        <!-- QUEUE -->
        <div class="col-lg-4 mb-4">
            <h5>Prescription Queue</h5>

            <div class="card queue-item mb-2" onclick="loadPrescription(1)">
                <div class="card-body">
                    <strong>John Moyo</strong><br>
                    <small>Dr. Ncube</small><br>
                    <span class="badge bg-secondary status-badge">Pending</span>
                </div>
            </div>

            <div class="card queue-item mb-2" onclick="loadPrescription(2)">
                <div class="card-body">
                    <strong>Mary Dube</strong><br>
                    <small>Dr. Chirwa</small><br>
                    <span class="badge bg-secondary status-badge">Pending</span>
                </div>
            </div>
        </div>

        <!-- PANEL -->
        <div class="col-lg-8">
            <h5>Prescription Details</h5>

            <div class="card mb-3">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label>Patient Name</label>
                            <input class="form-control readonly" id="pName" readonly>
                        </div>
                        <div class="col-md-6">
                            <label>Prescribing Doctor</label>
                            <input class="form-control readonly" id="doctor" readonly>
                        </div>
                    </div>
                </div>
            </div>

            <!-- DRUGS -->
            <div class="card mb-3">
                <div class="card-body">
                    <h6>Prescribed Medication</h6>
                    <table class="table table-bordered">
                        <thead class="table-light">
                        <tr>
                            <th>Drug</th>
                            <th>Dosage</th>
                            <th>Quantity</th>
                            <th>Stock</th>
                            <th>Dispense</th>
                        </tr>
                        </thead>
                        <tbody id="drugTable"></tbody>
                    </table>
                </div>
            </div>

            <!-- PAYMENT MODE (ADDED) -->
            <div class="card mb-3">
                <div class="card-body">
                    <h6>Payment Mode</h6>

                    <div class="d-flex gap-4 mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="radio"
                                   name="paymentMode" value="Cash" checked
                                   onchange="togglePayment()">
                            <label class="form-check-label">Cash</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio"
                                   name="paymentMode" value="Medical Aid"
                                   onchange="togglePayment()">
                            <label class="form-check-label">Medical Aid</label>
                        </div>
                    </div>

                    <div id="cashFields">
                        <label>Amount Paid</label>
                        <input type="number" class="form-control"
                               placeholder="Enter cash amount">
                    </div>

                    <div id="medicalAidFields" style="display:none;">
                        <label>Medical Aid / Claim Number</label>
                        <input type="text" class="form-control"
                               placeholder="Enter medical aid number">
                    </div>
                </div>
            </div>

            <!-- ACTIONS -->
            <div class="d-flex justify-content-end gap-2">
                <button class="btn btn-outline-danger" onclick="printExternalPrescription()">
                    Print External Prescription
                </button>
                <button class="btn btn-success" onclick="completeDispensing()">
                    Complete Dispensing
                </button>
            </div>

        </div>
    </div>
</div>

<div id="printSection">
    <h3>External Pharmacy Prescription</h3>
    <p id="printContent"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const inventory = {
        "Paracetamol": 50,
        "Amoxicillin": 0,
        "Ibuprofen": 30
    };

    const prescriptions = {
        1: {
            patient: "John Moyo",
            doctor: "Dr. Ncube",
            drugs: [
                { name: "Paracetamol", dosage: "500mg", qty: 10 },
                { name: "Amoxicillin", dosage: "250mg", qty: 20 }
            ]
        },
        2: {
            patient: "Mary Dube",
            doctor: "Dr. Chirwa",
            drugs: [
                { name: "Ibuprofen", dosage: "400mg", qty: 15 }
            ]
        }
    };

    let currentPrescriptionId = null;

    function loadPrescription(id) {
        currentPrescriptionId = id;
        document.getElementById("pName").value = prescriptions[id].patient;
        document.getElementById("doctor").value = prescriptions[id].doctor;

        const tbody = document.getElementById("drugTable");
        tbody.innerHTML = "";

        prescriptions[id].drugs.forEach(drug => {
            const stock = inventory[drug.name] || 0;
            tbody.innerHTML += `
                <tr>
                    <td>${drug.name}</td>
                    <td>${drug.dosage}</td>
                    <td>${drug.qty}</td>
                    <td>${stock > 0 ? stock : '<span class="text-danger">Out of stock</span>'}</td>
                    <td><input type="checkbox" ${stock > 0 ? "checked" : "disabled"}></td>
                </tr>`;
        });
    }

    function togglePayment() {
        const mode = document.querySelector('input[name="paymentMode"]:checked').value;
        document.getElementById("cashFields").style.display = mode === "Cash" ? "block" : "none";
        document.getElementById("medicalAidFields").style.display = mode === "Medical Aid" ? "block" : "none";
    }

    function completeDispensing() {
        if (!currentPrescriptionId) {
            alert("Select a prescription first.");
            return;
        }

        alert("Dispensing completed. Patient served.");
        document.querySelector(".queue-item").remove();
        document.getElementById("pName").value = "";
        document.getElementById("doctor").value = "";
        document.getElementById("drugTable").innerHTML = "";
        currentPrescriptionId = null;
    }

    function printExternalPrescription() {
        if (!currentPrescriptionId) {
            alert("Select a prescription first.");
            return;
        }

        const presc = prescriptions[currentPrescriptionId];
        let text = `Patient: ${presc.patient}\nDoctor: ${presc.doctor}\n\nMedication:\n`;

        presc.drugs.forEach(d => {
            if ((inventory[d.name] || 0) === 0) {
                text += `${d.name} - ${d.dosage} x ${d.qty}\n`;
            }
        });

        document.getElementById("printContent").innerText = text;
        window.print();
    }
</script>

</body>
</html>
