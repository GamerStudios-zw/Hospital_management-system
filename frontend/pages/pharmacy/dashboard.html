<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pharmacy | HMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .sidebar { min-height: 100vh; background: #0f172a; color: white; }
        .sidebar .nav-link { color: rgba(255,255,255,0.7); padding: 12px 20px; margin-bottom: 4px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #0ea5e9; color: white; }
        .btn-logout { color: #ef4444 !important; }
        .btn-logout:hover { background: rgba(239, 68, 68, 0.1) !important; color: #fca5a5 !important; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar d-flex flex-column p-3">
            <h4 class="fw-bold text-center py-3">💊 Pharmacy</h4>
            <ul class="nav flex-column mb-auto">
                <li class="nav-item"><a href="#" class="nav-link active"><i class="bi bi-prescription2 me-2"></i> Dispense</a></li>
                <li class="nav-item"><a href="../inventory/dashboard.html" class="nav-link"><i class="bi bi-boxes me-2"></i> Inventory</a></li>
            </ul>
            <button onclick="logout()" class="nav-link btn-logout border-0 bg-transparent text-start">
                <i class="bi bi-box-arrow-right me-2"></i> Logout
            </button>
        </div>

        <main class="col-md-10 bg-light p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0">Pharmacy Dispensing</h2>
                <button class="btn btn-outline-primary btn-sm" onclick="location.reload()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
            </div>

            <div id="alertContainer"></div>

            <div class="card border-0 shadow-sm mt-4">
                <div class="card-header bg-white py-3 fw-bold d-flex justify-content-between">
                    <span>Pending Prescriptions</span>
                    <span class="badge bg-primary" id="pendingCount">0 New</span>
                </div>
                <div class="card-body">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Patient</th>
                                <th>Medication</th>
                                <th>Dosage</th>
                                <th>Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="prescTable">
                            <tr><td colspan="5" class="text-center py-4">Loading prescriptions...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<div class="modal fade" id="dispenseModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-info text-white">
                <h5 class="modal-title">Dispense Medication</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p><strong>Patient:</strong> <span id="modalPatient"></span></p>

                <div class="list-group mb-3">
                    <div class="list-group-item">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="mb-0" id="modalMed"></h6>
                                <small class="text-muted" id="modalDosage"></small>
                            </div>
                            <span class="badge bg-success rounded-pill">Qty: <span id="modalQty"></span></span>
                        </div>
                        <small class="text-danger d-none" id="stockWarning">⚠️ Low Stock!</small>
                    </div>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="checkVerify">
                    <label class="form-check-label" for="checkVerify">
                        I verified the prescription and dosage.
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="confirmDispense()">Confirm Dispense</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/app.js"></script>
<script>
    protectPage(['pharmacist', 'admin']);

    let activePrescriptionId = null;

    document.addEventListener("DOMContentLoaded", () => {
        loadLowStock();
        loadPrescriptions();
    });

    // 1. Load Low Stock Alerts
    async function loadLowStock() {
        const items = await Api.get('/pharmacy/low_stock');
        const container = document.getElementById('alertContainer');
        container.innerHTML = '';

        if(items && items.length > 0) {
            items.forEach(i => {
                container.innerHTML += `
                    <div class="alert alert-warning d-flex align-items-center py-2" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <div>
                            <strong>Low Stock Warning:</strong> ${i.name} is below threshold (Qty: ${i.stock_quantity}).
                        </div>
                    </div>
                `;
            });
        }
    }

    // 2. Load Pending Prescriptions
    async function loadPrescriptions() {
        const list = await Api.get('/pharmacy/pending');
        const tbody = document.getElementById('prescTable');

        tbody.innerHTML = '';
        document.getElementById('pendingCount').innerText = (list ? list.length : 0) + " New";

        if(list && list.length > 0) {
            list.forEach(p => {
                const dateStr = new Date(p.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                // Pass data to modal via data attributes or click handler parameters
                const btn = `<button class="btn btn-sm btn-primary"
                    onclick="openDispenseModal(${p.id}, '${p.patient_name}', '${p.med_name}', ${p.quantity}, '${p.dosage}', ${p.stock_quantity})">
                    Dispense</button>`;

                tbody.innerHTML += `
                    <tr>
                        <td class="fw-bold">${p.patient_name}</td>
                        <td>${p.med_name}</td>
                        <td><span class="badge bg-light text-dark border">${p.dosage}</span></td>
                        <td>${dateStr}</td>
                        <td>${btn}</td>
                    </tr>
                `;
            });
        } else {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-5 text-muted">No pending prescriptions. All clear!</td></tr>';
        }
    }

    // 3. Open Modal
    function openDispenseModal(id, patient, med, qty, dosage, stock) {
        activePrescriptionId = id;
        document.getElementById('modalPatient').innerText = patient;
        document.getElementById('modalMed').innerText = med;
        document.getElementById('modalQty').innerText = qty;
        document.getElementById('modalDosage').innerText = dosage;
        document.getElementById('checkVerify').checked = false;

        const warning = document.getElementById('stockWarning');
        if(stock < qty) {
            warning.classList.remove('d-none');
            warning.innerText = `⚠️ Insufficient Stock! Available: ${stock}`;
            document.querySelector('.modal-footer .btn-primary').disabled = true;
        } else {
            warning.classList.add('d-none');
            document.querySelector('.modal-footer .btn-primary').disabled = false;
        }

        new bootstrap.Modal(document.getElementById('dispenseModal')).show();
    }

    // 4. Confirm Dispense
    async function confirmDispense() {
        if(!document.getElementById('checkVerify').checked) {
            alert("Please verify the dosage first.");
            return;
        }

        const res = await Api.post('/pharmacy/dispense', { prescription_id: activePrescriptionId });

        if(res) {
            alert("✅ Medication Dispensed Successfully!");
            location.reload();
        }
    }
</script>
</body>
</html>
