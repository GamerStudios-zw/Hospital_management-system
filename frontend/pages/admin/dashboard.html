<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | HMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f6f9; }

        /* Sidebar Styling */
        .sidebar {
            min-height: 100vh;
            background: #0f172a; /* Dark Navy */
            color: #fff;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,0.7);
            padding: 12px 20px;
            margin-bottom: 4px;
            border-radius: 8px;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        .sidebar .brand {
            font-size: 1.4rem;
            font-weight: 700;
            padding: 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        /* Stats Cards */
        .stat-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: transform 0.2s;
        }
        .stat-card:hover { transform: translateY(-3px); }
        .icon-box {
            width: 48px; height: 48px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
        }

        /* Main Content */
        .main-content { padding: 30px; }
        .header-nav { margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">

        <nav class="col-md-2 d-none d-md-block sidebar px-3">
            <div class="brand">
                <i class="bi bi-hospital me-2 text-primary"></i> HMS Admin
            </div>
                <ul class="nav flex-column">
                    <li class="nav-item"><a href="dashboard.html" class="nav-link active">Dashboard</a></li>
                    <li class="nav-item"><a href="staff_management.html" class="nav-link">Staff Management</a></li>
                    <li class="nav-item"><a href="system_logs.html" class="nav-link">System Logs</a></li>
                    <li class="nav-item"><a href="settings.html" class="nav-link">Settings</a></li>
               <li class="nav-item">
                    <button id="logoutBtn" class="nav-link text-danger w-100 text-start border-0 bg-transparent">
                        <i class="bi bi-box-arrow-right me-2"></i> Logout
                    </button>
               </li>
            </ul>
        </nav>

        <main class="col-md-10 ms-sm-auto main-content">

            <div class="header-nav">
                <div>
                    <h2 class="fw-bold m-0">System Overview</h2>
                    <p class="text-muted m-0">Welcome back, Administrator.</p>
                </div>
                <div>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addUserModal">
                        <i class="bi bi-person-plus-fill me-2"></i> Add New Staff
                    </button>
                </div>
            </div>

            <div class="row g-4 mb-5">
                <div class="col-md-3">
                    <div class="card stat-card p-3">
                        <div class="d-flex align-items-center">
                            <div class="icon-box bg-primary bg-opacity-10 text-primary me-3"><i class="bi bi-person-workspace"></i></div>
                            <div>
                                <h6 class="text-muted mb-0">Total Doctors</h6>
                                <h3 id="totalDoctors" class="fw-bold mb-0">--</h3>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card p-3">
                        <div class="d-flex align-items-center">
                            <div class="icon-box bg-success bg-opacity-10 text-success me-3"><i class="bi bi-bandaid"></i></div>
                            <div>
                                <h6 class="text-muted mb-0">Total Nurses</h6>
                                <h3 id="activeNurses" class="fw-bold mb-0">--</h3>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card p-3">
                        <div class="d-flex align-items-center">
                            <div class="icon-box bg-warning bg-opacity-10 text-warning me-3"><i class="bi bi-people-fill"></i></div>
                            <div>
                                <h6 class="text-muted mb-0">Receptionists</h6>
                                <h3 id="totalReceptionists" class="fw-bold mb-0">--</h3>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card p-3">
                        <div class="d-flex align-items-center">
                            <div class="icon-box bg-info bg-opacity-10 text-info me-3"><i class="bi bi-activity"></i></div>
                            <div>
                                <h6 class="text-muted mb-0">System Status</h6>
                                <h5 id="systemStatus" class="fw-bold mb-0 text-success">Checking...</h5>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card stat-card">
                <div class="card-header bg-white py-3 border-0 d-flex justify-content-between">
                    <h5 class="fw-bold mb-0">Staff Directory</h5>
                    <button class="btn btn-sm btn-light border" onclick="loadUsers()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
                </div>
                <div class="table-responsive p-3">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Name</th>
                                <th>Username</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <tr><td colspan="5" class="text-center py-4">Loading users...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
</div>

<div class="modal fade" id="addUserModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Create New Staff Account</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addUserForm">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Role</label>
                            <select class="form-select" required>
                                <option value="doctor">Doctor</option>
                                <option value="nurse">Nurse</option>
                                <option value="receptionist">Receptionist</option>
                                <option value="pharmacist">Pharmacist</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Temporary Password</label>
                            <input type="text" class="form-control" value="Staff123!" readonly>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="submitNewUser()">Create Account</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/app.js"></script>
<script>
    // 1. Security Check (Admin Only)
    document.addEventListener("DOMContentLoaded", () => {
        protectPage('admin');
        loadUsers();

        // Attach logout handler that ensures the backend logout request is sent
        const btn = document.getElementById('logoutBtn');
        if (btn) {
            btn.addEventListener('click', async (e) => {
                if (!confirm('Are you sure you want to log out?')) return;
                try {
                    // Send logout using token in localStorage via Api wrapper
                    await Api.post('/auth/logout', {});
                } catch (err) {
                    console.warn('Silent logout API error', err);
                }
                // Clear client state and redirect
                localStorage.removeItem('hms_token');
                localStorage.removeItem('hms_user');
                localStorage.removeItem('hms_role');
                window.location.href = '/Hospital_Management_System/frontend/pages/auth/login.html';
            });
        }
    });

    // 2. Load Users Function
    async function loadUsers() {
        const tbody = document.getElementById('usersTableBody');
        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4">Loading...</td></tr>';

        const users = await Api.get('/users');
        tbody.innerHTML = '';
        // Prepare and render
        if (users && users.length > 0) {
            // Stats counters
            let doctors = 0, totalNurses = 0, receptionists = 0;

            users.forEach(u => {
                // Count roles
                const role = (u.role || '').toLowerCase();
                if(role === 'doctor') doctors++;
                if(role === 'receptionist') receptionists++;
                if(role === 'nurse') totalNurses++;

                // Determine Badge Color
                let badgeClass = 'bg-secondary';
                if(role === 'doctor') badgeClass = 'bg-primary';
                if(role === 'nurse') badgeClass = 'bg-success';
                if(role === 'receptionist') badgeClass = 'bg-warning text-dark';
                if(role === 'pharmacist') badgeClass = 'bg-info text-dark';

                // Status badge based on is_active (0 = inactive)
                let statusBadge = '<span class="badge bg-secondary text-muted">Inactive</span>';
                if(u.is_active == 1 || u.is_active === '1') {
                    statusBadge = '<span class="badge bg-success-subtle text-success">Active</span>';
                }

                tbody.innerHTML += `
                    <tr>
                        <td class="fw-bold">${u.full_name}</td>
                        <td class="text-muted small">${u.username}</td>
                        <td><span class="badge ${badgeClass}">${(u.role||'').toUpperCase()}</span></td>
                        <td>${statusBadge}</td>
                        <td>
                            <button class="btn btn-sm btn-warning me-2" title="Reset Password" onclick="resetPassword(${u.id}, '${u.full_name.replace(/'/g, "\\'")}')">
                                <i class="bi bi-key-fill"></i> Reset
                            </button>
                            <button class="btn btn-sm btn-danger" title="Delete User" onclick="deleteUser(${u.id})">
                                <i class="bi bi-trash-fill"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            // Populate stat cards
            const tdEl = document.getElementById('totalDoctors');
            const anEl = document.getElementById('activeNurses');
            const trEl = document.getElementById('totalReceptionists');
            if(tdEl) tdEl.innerText = doctors;
            if(anEl) anEl.innerText = totalNurses;
            if(trEl) trEl.innerText = receptionists;

            // System status: backend reachable
            const sysEl = document.getElementById('systemStatus');
            if(sysEl) sysEl.innerText = 'Online';
        } else {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4">No users found.</td></tr>';
            const sysEl = document.getElementById('systemStatus');
            if(sysEl) sysEl.innerText = 'Online';
        }
    }

    // 3. Reset Password Function
    async function resetPassword(userId, name) {
        if(confirm(`Are you sure you want to reset the password for ${name}?\n\nIt will be set to: Staff123!`)) {
            const data = {
                action: 'reset_password',
                user_id: userId
            };
            const res = await Api.post('/users', data);
            if(res) {
                alert(`✅ Password for ${name} has been reset to Staff123!`);
            }
        }
    }

    // 4. Delete User Function
    async function deleteUser(userId) {
        if(confirm("Are you sure you want to delete this user? This cannot be undone.")) {
            // NOTE: Api.request is used for DELETE since Api.get/post are helpers
            const res = await Api.request(`/users?id=${userId}`, 'DELETE');
            if(res) {
                alert("User deleted.");
                loadUsers();
            }
        }
    }
</script>

</body>
</html>
