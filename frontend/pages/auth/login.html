<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Hospital Management System</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0d6efd;
            --secondary: #0a58ca;
            --dark: #0f172a;
            --light: #f8fafc;
            --muted: #94a3b8;
            --error: #dc2626;
            --success: #16a34a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Inter", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(
                rgba(15, 23, 42, 0.85),
                rgba(15, 23, 42, 0.85)
            ),
            url("../../assets/img/hero-hospital.jpg") center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.35);
            color: white;
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand h1 {
            font-size: 1.6rem;
            font-weight: 700;
        }

        .brand p {
            font-size: 0.9rem;
            color: var(--muted);
        }

        form {
            margin-top: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #e5e7eb;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.12);
            color: white;
            outline: none;
            transition: 0.3s ease;
        }

        input::placeholder {
            color: #cbd5f5;
        }

        input:focus {
            border-color: var(--primary);
            background: rgba(255,255,255,0.18);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            font-size: 0.85rem;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .remember input {
            width: auto;
        }

        .form-options a {
            color: var(--primary);
            text-decoration: none;
        }

        .form-options a:hover {
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(13,110,253,0.4);
        }

        .btn-login:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            color: var(--muted);
            font-size: 0.85rem;
        }

        .footer-text {
            text-align: center;
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 20px;
        }

        .footer-text a {
            color: var(--primary);
            text-decoration: none;
        }

        /* Alert Styling */
        #alertBox {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            text-align: center;
        }
        .alert-error { background: rgba(220, 38, 38, 0.2); color: #fecaca; border: 1px solid #dc2626; }
        .alert-success { background: rgba(22, 163, 74, 0.2); color: #bbf7d0; border: 1px solid #16a34a; }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 25px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="brand">
            <div style="font-size: 3rem; color: var(--primary); margin-bottom: 10px;">
                🏥
            </div>
            <h1>HMS Portal</h1>
            <p>Secure access for staff & administrators</p>
        </div>

        <div id="alertBox"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email / Username</label>
                <input type="text" id="email" placeholder="e.g. doc1" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="form-options">
                <div class="remember">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                </div>
            </div>

            <button type="submit" id="loginBtn" class="btn-login">Sign In</button>
        </form>

        <div class="divider">Hospital System • Secure Login</div>

        <div class="footer-text">
            © 2026 Hospital Management System
        </div>
    </div>

    <script>
        const API_URL = "http://localhost/Hospital_Management_System/backend/index.php/auth/login";

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            // 1. UI Elements
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const alertBox = document.getElementById('alertBox');

            // 2. Reset UI
            alertBox.style.display = 'none';
            loginBtn.disabled = true;
            loginBtn.innerText = "Authenticating...";

            // 3. Prepare Data
            const loginData = {
                username: emailInput.value.trim(), // Use trim() to fix accidental spaces
                password: passwordInput.value
            };

            try {
                // Debug log to see what we are sending
                console.log("Sending Login:", loginData);

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(loginData)
                });

                // Handle case where PHP crashes and returns HTML instead of JSON
                const rawText = await response.text();
                let result;
                try {
                    result = JSON.parse(rawText);
                } catch (err) {
                    console.error("Backend Error HTML:", rawText);
                    throw new Error("Server Error: " + rawText.substring(0, 50) + "...");
                }

                if (response.ok) {
                    // --- SUCCESS ---
                    console.log("Login Success:", result);

                    alertBox.className = 'alert-success';
                    alertBox.innerText = "Login Successful! Redirecting...";
                    alertBox.style.display = 'block';

                    // Save Data
                    localStorage.setItem("hms_token", result.token);
                    localStorage.setItem("hms_user", JSON.stringify(result.user));
                    localStorage.setItem("hms_role", result.user.role);

                    // Redirect based on Role
                    setTimeout(() => {
                        switch(result.user.role) {
                            case 'admin':        window.location.href = "../admin/dashboard.html"; break;
                            case 'doctor':       window.location.href = "../doctor/dashboard.html"; break;
                            case 'nurse':        window.location.href = "../nurse/dashboard.html"; break;
                            case 'receptionist': window.location.href = "../reception/receptionist.html"; break;
                            case 'pharmacist':   window.location.href = "../pharmacy/dashboard.html"; break;
                            default:
                                alert("Unknown Role: " + result.user.role);
                        }
                    }, 1000);

                } else {
                    // --- FAILURE ---
                    // Build a detailed error message
                    let msg = result.message || "Invalid credentials";

                    // Append specific reason if available (e.g. "User not found")
                    if (result.reason) {
                        msg += " (" + result.reason + ")";
                    }

                    // Log debug info if available
                    if (result.debug_info) {
                        console.warn("Debug Info:", result.debug_info);
                    }

                    throw new Error(msg);
                }

            } catch (error) {
                // Show Error on Screen
                console.error("Login Error:", error);
                alertBox.className = 'alert-error';
                alertBox.innerText = error.message;
                alertBox.style.display = 'block';

                // Reset Button
                loginBtn.disabled = false;
                loginBtn.innerText = "Sign In";
            }
        });
    </script>

</body>
</html>
