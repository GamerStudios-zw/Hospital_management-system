<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Staff Login | Hospital Management System</title>

    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../assets/css/theme.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #294a70;
            --secondary-color: #0f233a;
            --accent-color: #e44a3c;
            --text-color: #212529;
            --light-bg: #f8f9fa;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-color);
            background-color: #f0f2f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header (Matches Index) */
        .header {
            background: #294a70;
            padding: 12px 0;
            z-index: 997;
            box-shadow: 0px 2px 20px rgba(1, 41, 112, 0.1);
            width: 100%;
            border-bottom: 3px solid #e44a3c;
        }

        .logo {
            color: white;
            font-weight: 700;
            font-size: 24px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i { font-size: 28px; }

        .nav-link {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }
        .nav-link:hover { color: white; text-decoration: underline; }

        /* Login Section */
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: url('../../assets/img/hero-bg.jpg') center/cover;
            position: relative;
        }

        .login-wrapper::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(41, 74, 112, 0.6); /* Primary color overlay */
            z-index: 1;
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 2;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h3 {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 24px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-control {
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #ced4da;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(41, 74, 112, 0.25);
        }

        .btn-login {
            width: 100%;
            background: var(--primary-color);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
        }

        .btn-login:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #6c757d;
        }

        /* Alert Box */
        #alertBox {
            display: none;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }
        .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }

    </style>
</head>

<body>

<div class="topbar">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    <div><i class="bi bi-telephone me-2"></i>+263 77 425 1433</div>
    <div><i class="bi bi-envelope me-2"></i>support@hms.local</div>
  </div>
</div>
<header class="header">
  <div class="container-fluid d-flex align-items-center justify-content-between">
    <a class="logo" href="../../index.html"><i class="bi bi-hospital"></i> HMS</a>
  </div>
</header>


    <header class="header">
        <div class="container d-flex align-items-center justify-content-between">
            <a href="../../index.html" class="logo">
                <i class="bi bi-hospital"></i>
                <span>HMS</span>
            </a>
            <a href="../../index.html" class="nav-link">
                <i class="bi bi-arrow-left me-1"></i> Back to Home
            </a>
        </div>
    </header>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h3>Staff Portal</h3>
                <p>Secure access for authorized personnel</p>
            </div>

            <div id="alertBox"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label fw-bold small">Username / Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                        <input type="text" id="email" class="form-control" placeholder="Enter ID" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4 small">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember">
                        <label class="form-check-label text-muted" for="remember">Remember me</label>
                    </div>
                    <a href="#" class="text-decoration-none" style="color: var(--primary-color);">Forgot password?</a>
                </div>

                <button type="submit" id="loginBtn" class="btn-login">
                    Sign In <i class="bi bi-box-arrow-in-right ms-2"></i>
                </button>
            </form>

            <div class="footer-text">
                &copy; 2026 Hospital Management System<br>
                Restricted Access. Monitor Logic Active.
            </div>
        </div>
    </div>

    <script src="../../assets/js/app.js"></script>

    <script>
        // AUTOMATIC URL DETECTION
        const BASE_URL = window.location.origin + "/Hospital_Management_System/backend/index.php";
        const API_URL = `${BASE_URL}/auth/login`;

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            // 1. UI Elements
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const alertBox = document.getElementById('alertBox');

            // 2. Reset UI
            alertBox.style.display = 'none';
            loginBtn.disabled = true;
            loginBtn.innerHTML = 'Authenticating <span class="spinner-border spinner-border-sm ms-2"></span>';

            // 3. Prepare Data
            const loginData = {
                username: emailInput.value.trim(),
                password: passwordInput.value
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(loginData)
                });

                const rawText = await response.text();
                let result;
                try {
                    result = JSON.parse(rawText);
                } catch (err) {
                    throw new Error("Server Error: " + rawText.substring(0, 50) + "...");
                }

                if (response.ok) {
                    // --- SUCCESS ---
                    alertBox.className = 'alert-success';
                    alertBox.innerText = "Login Successful! Redirecting...";
                    alertBox.style.display = 'block';

                    localStorage.setItem("hms_token", result.token);
                    localStorage.setItem("hms_user", JSON.stringify(result.user));
                    localStorage.setItem("hms_role", result.user.role);

                    // Redirect based on Role (Wait 1s for better UX)
                    setTimeout(() => {
                        switch(result.user.role) {
                            case 'admin':        window.location.href = "../admin/dashboard.html"; break;
                            case 'doctor':       window.location.href = "../doctor/dashboard.html"; break;
                            case 'nurse':        window.location.href = "../nurse/dashboard.html"; break;
                            case 'receptionist': window.location.href = "../reception/dashboard.html"; break;
                            case 'pharmacist':   window.location.href = "../pharmacy/dashboard.html"; break;
                            case 'senior_pharmacist': window.location.href = "../pharmacy/dashboard.html"; break;
                            default: alert("Unknown Role: " + result.user.role);
                        }
                    }, 1000);

                } else {
                    // --- FAILURE ---
                    throw new Error(result.message || "Invalid credentials");
                }

            } catch (error) {
                console.error("Login Error:", error);
                alertBox.className = 'alert-error';
                alertBox.innerText = error.message;
                alertBox.style.display = 'block';

                // Reset Button
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Sign In <i class="bi bi-box-arrow-in-right ms-2"></i>';
            }
        });
    </script>

</body>
</html>
