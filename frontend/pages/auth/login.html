<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Hospital Management System</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0d6efd;
            --secondary: #0a58ca;
            --dark: #0f172a;
            --light: #f8fafc;
            --muted: #94a3b8;
            --error: #dc2626;
            --success: #16a34a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Inter", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(
                rgba(15, 23, 42, 0.85),
                rgba(15, 23, 42, 0.85)
            ),
            url("images/hospital-bg.jpg") center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.35);
            color: white;
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand img {
            width: 64px;
            margin-bottom: 10px;
        }

        .brand h1 {
            font-size: 1.6rem;
            font-weight: 700;
        }

        .brand p {
            font-size: 0.9rem;
            color: var(--muted);
        }

        form {
            margin-top: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #e5e7eb;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.12);
            color: white;
            outline: none;
            transition: 0.3s ease;
        }

        input::placeholder {
            color: #cbd5f5;
        }

        input:focus {
            border-color: var(--primary);
            background: rgba(255,255,255,0.18);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            font-size: 0.85rem;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .remember input {
            width: auto;
        }

        .form-options a {
            color: var(--primary);
            text-decoration: none;
        }

        .form-options a:hover {
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(13,110,253,0.4);
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            color: var(--muted);
            font-size: 0.85rem;
        }

        .footer-text {
            text-align: center;
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 20px;
        }

        .footer-text a {
            color: var(--primary);
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 25px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="brand">
            <img src="images/hospital-logo.png" alt="Hospital Logo">
            <h1>Hospital Management System</h1>
            <p>Secure access for staff & administrators</p>
        </div>

        <form>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@hospital.org" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <div class="form-options">
                <div class="remember">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                </div>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="btn-login">Sign In</button>
        </form>

        <div class="divider">Hospital System • Secure Login</div>

        <div class="footer-text">
            © 2026 Hospital Management System<br>
            <a href="#">Privacy Policy</a> • <a href="#">Support</a>
        </div>
    </div>

</body>
</html>
