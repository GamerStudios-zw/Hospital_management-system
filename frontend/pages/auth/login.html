<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login | Hospital Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../assets/css/sports-academy-theme.css" rel="stylesheet">
    <style>
        .icon-brand {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #173d8c;
            font-size: 1.3rem;
            font-weight: 700;
        }
        #alertBox {
            display: none;
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid transparent;
            font-size: 0.92rem;
        }
        .alert-error {
            display: block;
            background: rgba(215, 38, 56, 0.14);
            border-color: rgba(215, 38, 56, 0.35);
            color: #ffd9de;
        }
        .alert-success {
            display: block;
            background: rgba(42, 157, 99, 0.16);
            border-color: rgba(42, 157, 99, 0.36);
            color: #d9ffea;
        }
        .btn-login[disabled] {
            opacity: 0.75;
            cursor: not-allowed;
        }
        body.admin-theme[data-page="login"] .form-card .nav-link-lite {
            color: #4f6788;
        }
        body.admin-theme[data-page="login"] .form-card .nav-link-lite:hover,
        body.admin-theme[data-page="login"] .form-card .nav-link-lite:focus {
            color: #1d4f9b;
        }
        body.admin-theme[data-page="login"] .form-card .nav-link-lite.active::after,
        body.admin-theme[data-page="login"] .form-card .nav-link-lite:hover::after {
            background: linear-gradient(90deg, #1d4f9b, #17a166);
        }
        body.admin-theme[data-page="login"] .form-card .brand-copy span {
            color: #5f7799;
        }
        body.admin-theme[data-page="login"] .form-card .eyebrow {
            color: #36557d;
            border-color: #c8d9ef;
            background: #edf4ff;
        }
    </style>
</head>

<body class="admin-theme" data-page="login" data-login-scope="staff">
    <div class="page-shell d-flex align-items-center" style="min-height: 100vh;">
        <div class="orb orb-one"></div>
        <div class="orb orb-two"></div>

        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-xl-5 col-lg-6">
                    <div class="form-card p-4 p-lg-5">
                        <a href="../../index.html" class="nav-link-lite d-inline-flex align-items-center gap-2 mb-4">
                            <i class="bi bi-arrow-left"></i> Back to HMS home
                        </a>

                        <div class="brand-stack mb-4">
                            <span class="brand-mark icon-brand"><i class="bi bi-hospital"></i></span>
                            <div class="brand-copy">
                                <strong>HMS Staff Portal</strong>
                                <span>Secure login for authorized hospital personnel</span>
                            </div>
                        </div>

                        <span class="eyebrow"><i class="bi bi-shield-lock"></i> Authenticated access</span>
                        <h1 class="section-heading mt-3 mb-2">Sign in to continue.</h1>

                        <form id="loginForm" class="mt-4">
                            <div class="mb-3">
                                <label class="form-label">Username or Email</label>
                                <input id="email" type="text" class="form-control soft-input" placeholder="Enter your username or email" required>
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Password</label>
                                <input id="password" type="password" class="form-control soft-input" placeholder="Enter password" required>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4 mt-3 small">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="remember">
                                    <label class="form-check-label muted-copy" for="remember">Remember me</label>
                                </div>
                                <span class="muted-copy">Restricted access</span>
                            </div>

                            <button type="submit" id="loginBtn" class="btn-primary-soft btn-login w-100 border-0">
                                <i class="bi bi-box-arrow-in-right"></i> Sign In
                            </button>

                            <div id="alertBox"></div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../../assets/js/app.js"></script>

    <script>
        const BASE_URL = window.location.origin + "/Hospital_Management_System/backend/index.php";
        const API_URL = `${BASE_URL}/auth/login`;

        function setAlert(type, message) {
            const alertBox = document.getElementById("alertBox");
            alertBox.className = type;
            alertBox.textContent = message;
            alertBox.style.display = "block";
        }

        function setButtonLoading(isLoading) {
            const loginBtn = document.getElementById("loginBtn");
            loginBtn.disabled = isLoading;
            loginBtn.innerHTML = isLoading
                ? 'Authenticating <span class="spinner-border spinner-border-sm ms-2"></span>'
                : '<i class="bi bi-box-arrow-in-right"></i> Sign In';
        }

        function showLogoutReason() {
            const reason = sessionStorage.getItem("hms_logout_reason");
            if (!reason) return;
            sessionStorage.removeItem("hms_logout_reason");
            if (reason === "manual_logout") {
                setAlert("alert-success", "You have been logged out successfully.");
                return;
            }
            if (reason === "session_expired") {
                setAlert("alert-error", "Session timed out. Please sign in again.");
                return;
            }
            if (reason === "invalid_session") {
                setAlert("alert-error", "Your session data was invalid. Please sign in again.");
            }
        }

        showLogoutReason();

        document.getElementById("loginForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const emailInput = document.getElementById("email");
            const passwordInput = document.getElementById("password");
            const alertBox = document.getElementById("alertBox");

            alertBox.style.display = "none";
            setButtonLoading(true);

            const loginData = {
                username: emailInput.value.trim(),
                password: passwordInput.value
            };

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(loginData)
                });

                const rawText = await response.text();
                let result;
                try {
                    result = JSON.parse(rawText);
                } catch (err) {
                    throw new Error("Server Error: " + rawText.substring(0, 60) + "...");
                }

                if (!response.ok) {
                    throw new Error(result.message || "Invalid credentials");
                }

                const userPayload = result?.user || result?.data?.user || null;
                const tokenPayload = result?.token || result?.data?.token || null;
                if (!userPayload || !tokenPayload) {
                    throw new Error("Invalid login response from server.");
                }

                const rawRole = userPayload.role || userPayload.user_role || "";
                const normalizedRole = typeof normalizeRole === "function"
                    ? normalizeRole(rawRole)
                    : String(rawRole).trim().toLowerCase().replace(/[\s-]+/g, "_");

                if (!normalizedRole) {
                    throw new Error("Login succeeded but this account has no role assigned.");
                }

                userPayload.role = normalizedRole;
                localStorage.setItem("hms_token", tokenPayload);
                localStorage.setItem("hms_user", JSON.stringify(userPayload));
                localStorage.setItem("hms_role", normalizedRole);

                setAlert("alert-success", "Login successful. Redirecting...");

                const dashboardPathMap = {
                    admin: "../admin/dashboard.html",
                    nurse_in_charge: "../doctor/dashboard.html",
                    doctor: "../doctor/dashboard.html",
                    nurse: "../nurse/dashboard.html",
                    nurse_aid: "../nurse_aid/dashboard.html",
                    receptionist: "../reception/dashboard.html",
                    pharmacist: "../pharmacy/dashboard.html",
                    senior_pharmacist: "../pharmacy/dashboard.html",
                    it_support: "../it/itdashboard.html"
                };
                const destination = dashboardPathMap[normalizedRole] || "";
                if (!destination) {
                    if (typeof showNotification === "function") {
                        showNotification("Unknown Role: " + rawRole);
                    } else {
                        notify("Unknown Role: " + rawRole);
                    }
                    setButtonLoading(false);
                    return;
                }

                const roleLabel = normalizedRole.replace(/_/g, " ");
                if (typeof showSessionIntro === "function") {
                    await showSessionIntro("login", {
                        name: userPayload.full_name || userPayload.username || "",
                        subtitle: `Signed in as ${roleLabel}. Loading dashboard...`,
                        minDurationMs: 1250
                    });
                } else {
                    await new Promise((resolve) => setTimeout(resolve, 900));
                }

                window.location.href = destination;
            } catch (error) {
                console.error("Login Error:", error);
                setAlert("alert-error", error.message);
                setButtonLoading(false);
            }
        });
    </script>
</body>
</html>
