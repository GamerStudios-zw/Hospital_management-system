<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inventory Management | HMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex: 1;
            padding-bottom: 100px;
        }

        .navbar {
            background-color: #0d6efd;
            flex-shrink: 0;
        }

        .navbar-brand {
            color: #fff !important;
            font-weight: 600;
            font-size: 1rem;
        }

        .card {
            border-radius: 12px;
        }

        .low-stock {
            background-color: #fff3cd !important;
        }

        footer {
            background: #0d6efd;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: auto;
            flex-shrink: 0;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .navbar-brand {
                font-size: 0.9rem;
            }

            .d-flex.justify-content-between {
                flex-direction: column;
                gap: 10px;
            }

            .btn-group {
                width: 100%;
            }

            .btn {
                width: 100%;
            }

            table {
                font-size: 0.85rem;
            }

            th, td {
                padding: 0.5rem !important;
            }
        }

        @media (max-width: 576px) {
            .container {
                padding-left: 10px;
                padding-right: 10px;
            }

            .card-body {
                padding: 1rem;
            }

            h4 {
                font-size: 1.2rem;
            }

            .table-responsive {
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <span class="navbar-brand">Hospital Management System | Inventory</span>

        <div class="dropdown">
            <button class="btn btn-light rounded-circle" data-bs-toggle="dropdown">
                <i class="bi bi-person"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="#">Update Profile</a></li>
                <li><a class="dropdown-item" href="#">Change Password</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item text-danger" href="index.html">Logout</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- CONTENT -->
<div class="main-content">
    <div class="container mt-4">
        <div class="card shadow-sm">
            <div class="card-body">

                <div class="d-flex justify-content-between mb-3 align-items-start">
                    <h4 class="mb-0">Inventory Stock Control</h4>
                    <div class="d-flex gap-2 flex-wrap justify-content-end">
                        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addItemModal">
                            <i class="bi bi-plus-circle"></i> <span class="d-none d-sm-inline">Add Item</span>
                        </button>
                        <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#purchaseModal">
                            <i class="bi bi-cart"></i> <span class="d-none d-sm-inline">Purchase Request</span>
                        </button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-bordered table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>#</th>
                                <th>Item</th>
                                <th>Category</th>
                                <th>Quantity</th>
                                <th>Reorder Level</th>
                                <th class="d-none d-md-table-cell">Last Stock In</th>
                                <th class="d-none d-md-table-cell">Last Stock Out</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryTable"></tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- ADD ITEM MODAL -->
<div class="modal fade" id="addItemModal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5>Add Inventory Item</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input class="form-control mb-2" id="itemName" placeholder="Item Name">
                <select class="form-select mb-2" id="itemCategory">
                    <option>Medicine</option>
                    <option>Equipment</option>
                    <option>Consumable</option>
                </select>
                <input class="form-control mb-2" type="number" id="itemQty" placeholder="Initial Quantity">
                <input class="form-control" type="number" id="itemReorder" placeholder="Reorder Level">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-success" onclick="addItem()">Add</button>
            </div>
        </div>
    </div>
</div>

<!-- STOCK IN / OUT MODAL -->
<div class="modal fade" id="stockModal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5>Update Stock</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <select class="form-select mb-2" id="stockType">
                    <option value="in">Stock In</option>
                    <option value="out">Stock Out</option>
                </select>
                <input class="form-control" type="number" id="stockQty" placeholder="Quantity">
                <input type="hidden" id="stockIndex">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" onclick="updateStock()">Save</button>
            </div>
        </div>
    </div>
</div>

<!-- PURCHASE REQUEST MODAL -->
<div class="modal fade" id="purchaseModal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5>Purchase Request</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input class="form-control mb-2" placeholder="Item Name">
                <input class="form-control mb-2" type="number" placeholder="Quantity Required">
                <textarea class="form-control" placeholder="Reason / Notes"></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-danger">Submit Request</button>
            </div>
        </div>
    </div>
</div>

<footer>
    &copy; 2026 Hospital Management System | Inventory Module
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let inventory = [
        { name: "Paracetamol 500mg", category: "Medicine", qty: 120, reorder: 30, inDate: "2026-01-10", outDate: "2026-01-20" },
        { name: "Gloves", category: "Consumable", qty: 20, reorder: 50, inDate: "2026-01-05", outDate: "2026-01-22" }
    ];

    function render() {
        const table = document.getElementById("inventoryTable");
        table.innerHTML = "";

        inventory.forEach((item, i) => {
            const row = document.createElement("tr");
            if (item.qty <= item.reorder) row.classList.add("low-stock");

            row.innerHTML = `
                <td>${i + 1}</td>
                <td>${item.name}</td>
                <td>${item.category}</td>
                <td>${item.qty}</td>
                <td>${item.reorder}</td>
                <td class="d-none d-md-table-cell">${item.inDate || "-"}</td>
                <td class="d-none d-md-table-cell">${item.outDate || "-"}</td>
                <td>
                    <button class="btn btn-sm btn-warning" onclick="openStock(${i})">
                        <i class="bi bi-arrow-left-right"></i>
                    </button>
                </td>
            `;
            table.appendChild(row);
        });
    }

    function addItem() {
        inventory.push({
            name: itemName.value,
            category: itemCategory.value,
            qty: parseInt(itemQty.value),
            reorder: parseInt(itemReorder.value),
            inDate: new Date().toISOString().split("T")[0],
            outDate: ""
        });
        bootstrap.Modal.getInstance(addItemModal).hide();
        render();
    }

    function openStock(i) {
        stockIndex.value = i;
        new bootstrap.Modal(stockModal).show();
    }

    function updateStock() {
        const i = stockIndex.value;
        const qty = parseInt(stockQty.value);
        const today = new Date().toISOString().split("T")[0];

        if (stockType.value === "in") {
            inventory[i].qty += qty;
            inventory[i].inDate = today;
        } else {
            inventory[i].qty -= qty;
            inventory[i].outDate = today;
        }

        bootstrap.Modal.getInstance(stockModal).hide();
        render();
    }

    render();
</script>

</body>
</html>
