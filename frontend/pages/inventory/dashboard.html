<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inventory | HMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .sidebar { min-height: 100vh; background: #0f172a; color: white; }
        .sidebar .nav-link { color: rgba(255,255,255,0.7); padding: 12px 20px; margin-bottom: 4px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #f59e0b; color: white; }
        .btn-logout { color: #ef4444 !important; }
        .btn-logout:hover { background: rgba(239, 68, 68, 0.1) !important; color: #fca5a5 !important; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar d-flex flex-column p-3">
            <h4 class="fw-bold text-center py-3">📦 Inventory</h4>
            <ul class="nav flex-column mb-auto">
                <li class="nav-item"><a href="../pharmacy/dashboard.html" class="nav-link"><i class="bi bi-arrow-left me-2"></i> Back to Pharmacy</a></li>
                <li class="nav-item"><a href="#" class="nav-link active"><i class="bi bi-boxes me-2"></i> Stock List</a></li>
                <li class="nav-item"><a href="#" class="nav-link"><i class="bi bi-cart-plus me-2"></i> Orders</a></li>
                <li class="nav-item"><a href="#" class="nav-link"><i class="bi bi-calendar-x me-2"></i> Expiry Check</a></li>
            </ul>
            <button onclick="logout()" class="nav-link btn-logout border-0 bg-transparent text-start">
                <i class="bi bi-box-arrow-right me-2"></i> Logout
            </button>
        </div>

        <main class="col-md-10 bg-light p-4">
            <div class="d-flex justify-content-between mb-4">
                <h2>Medical Inventory</h2>
                <button class="btn btn-warning text-dark fw-bold" data-bs-toggle="modal" data-bs-target="#addStockModal">
                    <i class="bi bi-plus-square me-2"></i> Add New Stock
                </button>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <table class="table table-hover align-middle" id="inventoryTable">
                        <thead class="table-light">
                            <tr>
                                <th>Drug Name</th>
                                <th>Batch No.</th>
                                <th>Quantity</th>
                                <th>Expiry Date</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryBody">
                            <tr>
                                <td class="fw-bold">Paracetamol 500mg</td>
                                <td>BATCH-001</td>
                                <td>500 Boxes</td>
                                <td>Dec 2026</td>
                                <td><span class="badge bg-success">Good</span></td>
                                <td>
                                    <button class="btn btn-sm btn-outline-secondary" onclick="editStock(this)">Edit</button>
                                </td>
                            </tr>
                            <tr class="table-warning">
                                <td class="fw-bold">Amoxicillin 500mg</td>
                                <td>BATCH-099</td>
                                <td class="text-danger fw-bold">12 Boxes</td>
                                <td>Mar 2026</td>
                                <td><span class="badge bg-warning text-dark">Low Stock</span></td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary" onclick="reorderStock(this)">Reorder</button>
                                    <button class="btn btn-sm btn-outline-secondary" onclick="editStock(this)">Edit</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Add Stock Modal -->
<div class="modal fade" id="addStockModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-warning">
                <h5 class="modal-title">Add New Stock</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addStockForm">
                    <div class="mb-3">
                        <label class="form-label">Drug Name</label>
                        <input type="text" class="form-control" id="drugName" placeholder="e.g. Ibuprofen" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Batch Number</label>
                        <input type="text" class="form-control" id="batchNo" placeholder="e.g. BATCH-100" required>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label">Quantity</label>
                            <input type="number" class="form-control" id="quantity" required>
                        </div>
                        <div class="col">
                            <label class="form-label">Unit</label>
                            <select class="form-select" id="unit">
                                <option>Boxes</option>
                                <option>Bottles</option>
                                <option>Tablets</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Expiry Date</label>
                        <input type="date" class="form-control" id="expiryDate" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveStock()">Save Stock</button>
            </div>
        </div>
    </div>
</div>

<!-- Edit Stock Modal -->
<div class="modal fade" id="editStockModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-info">
                <h5 class="modal-title">Edit Stock</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editStockForm">
                    <input type="hidden" id="editRowIndex">
                    <div class="mb-3">
                        <label class="form-label">Drug Name</label>
                        <input type="text" class="form-control" id="editDrugName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Batch Number</label>
                        <input type="text" class="form-control" id="editBatchNo" required>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label">Quantity</label>
                            <input type="number" class="form-control" id="editQuantity" required>
                        </div>
                        <div class="col">
                            <label class="form-label">Unit</label>
                            <select class="form-select" id="editUnit">
                                <option>Boxes</option>
                                <option>Bottles</option>
                                <option>Tablets</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Expiry Date</label>
                        <input type="date" class="form-control" id="editExpiryDate" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger" onclick="deleteStock()">Delete</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="updateStock()">Update Stock</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Mock logout function (replace with actual implementation)
    function logout() {
        alert('Logging out...');
        // window.location.href = '/login.html';
    }

    // Mock protectPage function (replace with actual implementation)
    function protectPage(roles) {
        console.log('Page protected for roles:', roles);
    }

    // Save new stock
    function saveStock() {
        const form = document.getElementById('addStockForm');
        
        if (!form.checkValidity()) {
            form.reportValidity();
            return;
        }

        const drugName = document.getElementById('drugName').value;
        const batchNo = document.getElementById('batchNo').value;
        const quantity = document.getElementById('quantity').value;
        const unit = document.getElementById('unit').value;
        const expiryDate = document.getElementById('expiryDate').value;

        // Format expiry date
        const date = new Date(expiryDate);
        const formattedDate = date.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });

        // Determine status based on quantity
        let status = 'Good';
        let badgeClass = 'bg-success';
        let rowClass = '';
        
        if (parseInt(quantity) < 50) {
            status = 'Low Stock';
            badgeClass = 'bg-warning text-dark';
            rowClass = 'table-warning';
        }

        // Add row to table
        const tbody = document.getElementById('inventoryBody');
        const newRow = tbody.insertRow();
        newRow.className = rowClass;
        
        newRow.innerHTML = `
            <td class="fw-bold">${drugName}</td>
            <td>${batchNo}</td>
            <td ${parseInt(quantity) < 50 ? 'class="text-danger fw-bold"' : ''}>${quantity} ${unit}</td>
            <td>${formattedDate}</td>
            <td><span class="badge ${badgeClass}">${status}</span></td>
            <td>
                ${parseInt(quantity) < 50 ? '<button class="btn btn-sm btn-outline-primary" onclick="reorderStock(this)">Reorder</button>' : ''}
                <button class="btn btn-sm btn-outline-secondary" onclick="editStock(this)">Edit</button>
            </td>
        `;

        // Close modal and reset form
        const modal = bootstrap.Modal.getInstance(document.getElementById('addStockModal'));
        modal.hide();
        form.reset();

        alert('Stock added successfully!');
    }

    // Edit stock
    function editStock(button) {
        const row = button.closest('tr');
        const cells = row.cells;

        // Extract current values
        const drugName = cells[0].textContent;
        const batchNo = cells[1].textContent;
        const quantityText = cells[2].textContent.trim();
        const quantity = quantityText.match(/\d+/)[0];
        const unit = quantityText.split(' ').slice(-1)[0];
        const expiryDateText = cells[3].textContent;

        // Convert expiry date to input format
        const expiryDate = new Date(expiryDateText);
        const formattedDate = expiryDate.toISOString().split('T')[0];

        // Populate edit form
        document.getElementById('editRowIndex').value = row.rowIndex - 1;
        document.getElementById('editDrugName').value = drugName;
        document.getElementById('editBatchNo').value = batchNo;
        document.getElementById('editQuantity').value = quantity;
        document.getElementById('editUnit').value = unit;
        document.getElementById('editExpiryDate').value = formattedDate;

        // Show edit modal
        const editModal = new bootstrap.Modal(document.getElementById('editStockModal'));
        editModal.show();
    }

    // Update stock
    function updateStock() {
        const form = document.getElementById('editStockForm');
        
        if (!form.checkValidity()) {
            form.reportValidity();
            return;
        }

        const rowIndex = document.getElementById('editRowIndex').value;
        const tbody = document.getElementById('inventoryBody');
        const row = tbody.rows[rowIndex];

        const drugName = document.getElementById('editDrugName').value;
        const batchNo = document.getElementById('editBatchNo').value;
        const quantity = document.getElementById('editQuantity').value;
        const unit = document.getElementById('editUnit').value;
        const expiryDate = document.getElementById('editExpiryDate').value;

        // Format expiry date
        const date = new Date(expiryDate);
        const formattedDate = date.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });

        // Determine status
        let status = 'Good';
        let badgeClass = 'bg-success';
        let rowClass = '';
        
        if (parseInt(quantity) < 50) {
            status = 'Low Stock';
            badgeClass = 'bg-warning text-dark';
            rowClass = 'table-warning';
        }

        row.className = rowClass;
        row.innerHTML = `
            <td class="fw-bold">${drugName}</td>
            <td>${batchNo}</td>
            <td ${parseInt(quantity) < 50 ? 'class="text-danger fw-bold"' : ''}>${quantity} ${unit}</td>
            <td>${formattedDate}</td>
            <td><span class="badge ${badgeClass}">${status}</span></td>
            <td>
                ${parseInt(quantity) < 50 ? '<button class="btn btn-sm btn-outline-primary" onclick="reorderStock(this)">Reorder</button>' : ''}
                <button class="btn btn-sm btn-outline-secondary" onclick="editStock(this)">Edit</button>
            </td>
        `;

        // Close modal
        const modal = bootstrap.Modal.getInstance(document.getElementById('editStockModal'));
        modal.hide();

        alert('Stock updated successfully!');
    }

    // Delete stock
    function deleteStock() {
        if (!confirm('Are you sure you want to delete this stock item?')) {
            return;
        }

        const rowIndex = document.getElementById('editRowIndex').value;
        const tbody = document.getElementById('inventoryBody');
        tbody.deleteRow(rowIndex);

        // Close modal
        const modal = bootstrap.Modal.getInstance(document.getElementById('editStockModal'));
        modal.hide();

        alert('Stock deleted successfully!');
    }

    // Reorder stock
    function reorderStock(button) {
        const row = button.closest('tr');
        const drugName = row.cells[0].textContent;
        
        const quantity = prompt(`Enter reorder quantity for ${drugName}:`, '100');
        
        if (quantity && parseInt(quantity) > 0) {
            alert(`Reorder request submitted for ${quantity} units of ${drugName}`);
            // Here you would typically send this to a backend API
        }
    }

    // Initialize page protection
    protectPage(['pharmacist', 'admin']);
</script>
</body>
</html>
