<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inventory | HMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .sidebar { min-height: 100vh; background: #0f172a; color: white; }
        .sidebar .nav-link { color: rgba(255,255,255,0.7); padding: 12px 20px; margin-bottom: 4px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #f59e0b; color: white; } /* Amber for Inventory */
        .btn-logout { color: #ef4444 !important; }
        .btn-logout:hover { background: rgba(239, 68, 68, 0.1) !important; color: #fca5a5 !important; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar d-flex flex-column p-3">
            <h4 class="fw-bold text-center py-3">📦 Inventory</h4>
            <ul class="nav flex-column mb-auto">
                <li class="nav-item"><a href="../pharmacy/dashboard.html" class="nav-link"><i class="bi bi-arrow-left me-2"></i> Back to Pharmacy</a></li>
                <li class="nav-item"><a href="#" class="nav-link active"><i class="bi bi-boxes me-2"></i> Stock List</a></li>
                <li class="nav-item"><a href="#" class="nav-link"><i class="bi bi-cart-plus me-2"></i> Orders</a></li>
                <li class="nav-item"><a href="#" class="nav-link"><i class="bi bi-calendar-x me-2"></i> Expiry Check</a></li>
            </ul>
            <button onclick="logout()" class="nav-link btn-logout border-0 bg-transparent text-start">
                <i class="bi bi-box-arrow-right me-2"></i> Logout
            </button>
        </div>

        <main class="col-md-10 bg-light p-4">
            <div class="d-flex justify-content-between mb-4">
                <h2>Medical Inventory</h2>
                <button class="btn btn-warning text-dark fw-bold" data-bs-toggle="modal" data-bs-target="#addStockModal">
                    <i class="bi bi-plus-square me-2"></i> Add New Stock
                </button>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Drug Name</th>
                                <th>Batch No.</th>
                                <th>Quantity</th>
                                <th>Expiry Date</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="fw-bold">Paracetamol 500mg</td>
                                <td>BATCH-001</td>
                                <td>500 Boxes</td>
                                <td>Dec 2026</td>
                                <td><span class="badge bg-success">Good</span></td>
                                <td><button class="btn btn-sm btn-outline-secondary">Edit</button></td>
                            </tr>
                            <tr class="table-warning">
                                <td class="fw-bold">Amoxicillin 500mg</td>
                                <td>BATCH-099</td>
                                <td class="text-danger fw-bold">12 Boxes</td>
                                <td>Mar 2026</td>
                                <td><span class="badge bg-warning text-dark">Low Stock</span></td>
                                <td><button class="btn btn-sm btn-outline-primary">Reorder</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<div class="modal fade" id="addStockModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-warning">
                <h5 class="modal-title">Add New Stock</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form>
                    <div class="mb-3">
                        <label class="form-label">Drug Name</label>
                        <input type="text" class="form-control" placeholder="e.g. Ibuprofen">
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label">Quantity</label>
                            <input type="number" class="form-control">
                        </div>
                        <div class="col">
                            <label class="form-label">Unit</label>
                            <select class="form-select"><option>Boxes</option><option>Bottles</option><option>Tablets</option></select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Expiry Date</label>
                        <input type="date" class="form-control">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="alert('Stock Added!')">Save Stock</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/app.js"></script>
<script>
    // Allowed: Pharmacist and Admin can manage inventory
    protectPage(['pharmacist', 'admin']);
</script>
</body>
</html>
