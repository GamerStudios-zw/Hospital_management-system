<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admissions | HMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .sidebar { min-height: 100vh; background: #0f172a; color: #fff; }
        .sidebar .nav-link { color: rgba(255,255,255,0.7); padding: 12px 20px; margin-bottom: 4px; border-radius: 8px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #10b981; color: #fff; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar px-3 py-4 d-flex flex-column justify-content-between">
            <div>
                <h5 class="text-white fw-bold mb-4 px-2">🏥 HMS Nurse</h5>
                <ul class="nav flex-column">
                    <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="bi bi-speedometer2 me-2"></i> Triage</a></li>
                    <li class="nav-item"><a href="ward_monitoring.html" class="nav-link"><i class="bi bi-heart-pulse me-2"></i> Ward Monitor</a></li>
                    <li class="nav-item"><a href="admissions.html" class="nav-link active"><i class="bi bi-clipboard-plus me-2"></i> Admissions</a></li>
                    <li class="nav-item"><a href="shift_roster.html" class="nav-link"><i class="bi bi-people me-2"></i> Shift Roster</a></li>
                </ul>
            </div>
            <button onclick="logout()" class="btn text-danger fw-bold text-start w-100"><i class="bi bi-box-arrow-right me-2"></i> Logout</button>
        </div>

        <main class="col-md-10 bg-light p-4">
            <h4 class="fw-bold mb-4">Patient Admission Form</h4>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Patient Name</label>
                                <input type="text" class="form-control" placeholder="Enter full name">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Emergency Contact</label>
                                <input type="tel" class="form-control" placeholder="+263...">
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold">Reason for Admission</label>
                                <textarea class="form-control" rows="2"></textarea>
                            </div>
                            
                            <h6 class="mt-4 mb-2 text-primary">Ward Assignment</h6>
                            <div class="col-md-4">
                                <label class="form-label">Ward Type</label>
                                <select class="form-select">
                                    <option>General Ward</option>
                                    <option>Private Ward</option>
                                    <option>ICU</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Assign Bed</label>
                                <select class="form-select">
                                    <option>Bed A-02</option>
                                    <option>Bed A-05</option>
                                    <option>Bed B-01</option>
                                </select>
                            </div>
                        </div>
                        <div class="mt-4 d-flex justify-content-end">
                            <button type="button" class="btn btn-secondary me-2">Cancel</button>
                            <button type="button" class="btn btn-success" onclick="alert('Patient Admitted Successfully!')">Confirm Admission</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/app.js"></script>
<script>
    protectPage(['nurse', 'admin']);
</script>
</body>
</html>
