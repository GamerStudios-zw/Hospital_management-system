<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nurse / Triage Dashboard | HMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f7fb;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        .queue-card {
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .queue-card:hover {
            background: #e9f2ff;
        }

        .readonly-input {
            background-color: #e9ecef;
        }

        .profile-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid #fff;
        }

        footer {
            background: #0b1d3a;
            color: #ccc;
        }
    </style>
</head>

<body>

<!-- TOP NAVBAR -->
<nav class="navbar navbar-dark bg-primary px-3 d-flex justify-content-between">
    <span class="navbar-brand">
        <i class="bi bi-heart-pulse"></i> Hospital Management System
    </span>

    <div class="d-flex align-items-center gap-3">
        <span class="text-white d-none d-md-inline">Nurse / Triage</span>
        <img src="https://via.placeholder.com/150"
             class="profile-avatar"
             data-bs-toggle="modal"
             data-bs-target="#profileModal"
             id="profileImage">
    </div>
</nav>

<div class="container-fluid p-4">

    <div class="row">

        <!-- PATIENT QUEUE -->
        <div class="col-lg-4 mb-4">
            <h5 class="mb-3">Patient Queue</h5>

            <div class="card queue-card mb-2" onclick="loadPatient(1)">
                <div class="card-body">
                    <strong>John Moyo</strong><br>
                    <small>ID: 12-345678A12</small>
                </div>
            </div>

            <div class="card queue-card mb-2" onclick="loadPatient(2)">
                <div class="card-body">
                    <strong>Mary Dube</strong><br>
                    <small>ID: 63-987654B09</small>
                </div>
            </div>

            <div class="card">
                <div class="card-body text-muted">
                    Waiting for patients...
                </div>
            </div>
        </div>

        <!-- PATIENT DETAILS + VITALS -->
        <div class="col-lg-8">

            <h5 class="mb-3">Patient Details (Read-Only)</h5>
            <div class="card mb-4">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label>Full Name</label>
                            <input class="form-control readonly-input" id="pName" readonly>
                        </div>
                        <div class="col-md-6">
                            <label>ID Number</label>
                            <input class="form-control readonly-input" id="pID" readonly>
                        </div>
                        <div class="col-md-6">
                            <label>Date of Birth</label>
                            <input class="form-control readonly-input" id="pDOB" readonly>
                        </div>
                        <div class="col-md-6">
                            <label>Allergies</label>
                            <input class="form-control readonly-input" id="pAllergies" readonly>
                        </div>
                    </div>
                </div>
            </div>

            <h5>Record Vitals</h5>
            <div class="card">
                <div class="card-body">
                    <form id="vitalsForm">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label>Temperature (°C)</label>
                                <input type="number" step="0.1" class="form-control" required>
                            </div>
                            <div class="col-md-3">
                                <label>Blood Pressure</label>
                                <input type="text" placeholder="120/80" class="form-control" required>
                            </div>
                            <div class="col-md-3">
                                <label>Weight (kg)</label>
                                <input type="number" class="form-control" required>
                            </div>
                            <div class="col-md-3">
                                <label>Blood Glucose</label>
                                <input type="number" class="form-control" required>
                            </div>
                        </div>

                        <div class="mt-4 text-end">
                            <button type="button" class="btn btn-success"
                                    data-bs-toggle="modal" data-bs-target="#sendModal">
                                <i class="bi bi-send"></i> Send to Doctor
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- PROFILE MODAL -->
<div class="modal fade" id="profileModal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">My Profile</h5>
            </div>
            <div class="modal-body">
                <div class="text-center mb-3">
                    <img id="profilePreview"
                         src="https://via.placeholder.com/150"
                         class="rounded-circle mb-2"
                         width="100" height="100">
                    <input type="file" class="form-control" accept="image/*"
                           onchange="previewImage(event)">
                </div>

                <hr>

                <label>New Password</label>
                <input type="password" class="form-control mb-2">

                <label>Confirm Password</label>
                <input type="password" class="form-control">
            </div>
            <div class="modal-footer justify-content-between">
                <button class="btn btn-danger" onclick="logout()">Logout</button>
                <button class="btn btn-primary" data-bs-dismiss="modal">Save Changes</button>
            </div>
        </div>
    </div>
</div>

<!-- SEND MODAL -->
<div class="modal fade" id="sendModal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5>Confirm Submission</h5>
            </div>
            <div class="modal-body">
                Send patient vitals to doctor?
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" onclick="submitVitals()">Confirm</button>
            </div>
        </div>
    </div>
</div>

<footer class="text-center p-3 mt-4">
    HMS © 2026 • Nurse / Triage Module
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const patients = {
        1: { name: "John Moyo", id: "12-345678A12", dob: "1985-06-12", allergies: "Penicillin" },
        2: { name: "Mary Dube", id: "63-987654B09", dob: "1992-11-23", allergies: "None" }
    };

    let selectedPatientId = null;

    function loadPatient(id) {
        selectedPatientId = id;
        document.getElementById("pName").value = patients[id].name;
        document.getElementById("pID").value = patients[id].id;
        document.getElementById("pDOB").value = patients[id].dob;
        document.getElementById("pAllergies").value = patients[id].allergies;
    }

    function submitVitals() {
        if (!selectedPatientId) {
            alert("No patient selected.");
            return;
        }

        // Remove patient card from queue
        const cards = document.querySelectorAll(".queue-card");
        cards.forEach(card => {
            if (card.innerText.includes(patients[selectedPatientId].name)) {
                card.remove();
            }
        });

        // Clear patient details
        document.getElementById("pName").value = "";
        document.getElementById("pID").value = "";
        document.getElementById("pDOB").value = "";
        document.getElementById("pAllergies").value = "";
        document.getElementById("vitalsForm").reset();

        selectedPatientId = null;

        alert("Vitals sent to doctor. Patient removed from queue.");

        bootstrap.Modal
            .getInstance(document.getElementById("sendModal"))
            .hide();
    }

    function previewImage(event) {
        const reader = new FileReader();
        reader.onload = () => {
            document.getElementById("profilePreview").src = reader.result;
            document.getElementById("profileImage").src = reader.result;
        };
        reader.readAsDataURL(event.target.files[0]);
    }

    function logout() {
        window.location.href = "index.html";
    }
</script>

</body>
</html>
