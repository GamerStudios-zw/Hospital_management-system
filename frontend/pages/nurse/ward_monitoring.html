<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Monitoring | HMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .sidebar { min-height: 100vh; background: #0f172a; color: #fff; }
        .sidebar .nav-link { color: rgba(255,255,255,0.7); padding: 12px 20px; margin-bottom: 4px; border-radius: 8px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #10b981; color: #fff; }

        .bed-card {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px;
            background: white;
            transition: 0.2s;
            position: relative;
            overflow: hidden;
        }
        .bed-card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .status-stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar px-3 py-4 d-flex flex-column justify-content-between">
            <div>
                <h5 class="text-white fw-bold mb-4 px-2">🏥 HMS Nurse</h5>
                <ul class="nav flex-column">
                    <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="bi bi-speedometer2 me-2"></i> Triage</a></li>
                    <li class="nav-item"><a href="ward_monitoring.html" class="nav-link active"><i class="bi bi-heart-pulse me-2"></i> Ward Monitor</a></li>
                    <li class="nav-item"><a href="admissions.html" class="nav-link"><i class="bi bi-clipboard-plus me-2"></i> Admissions</a></li>
                    <li class="nav-item"><a href="shift_roster.html" class="nav-link"><i class="bi bi-people me-2"></i> Shift Roster</a></li>
                </ul>
            </div>
            <button onclick="logout()" class="btn text-danger fw-bold text-start w-100"><i class="bi bi-box-arrow-right me-2"></i> Logout</button>
        </div>

        <main class="col-md-10 bg-light p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold">Ward Occupancy Status</h4>
                <button class="btn btn-outline-primary btn-sm" onclick="loadBeds()">
                    <i class="bi bi-arrow-clockwise me-1"></i> Refresh
                </button>
            </div>

            <div id="wardContainer">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted">Loading ward data...</p>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/app.js"></script>
<script>
    protectPage(['nurse', 'admin']);

    document.addEventListener("DOMContentLoaded", loadBeds);

    async function loadBeds() {
        const container = document.getElementById('wardContainer');
        const beds = await Api.get('/nurse/beds');

        container.innerHTML = ''; // Clear loading spinner

        if(beds && beds.length > 0) {
            // Group beds by Ward Name
            const wards = {};
            beds.forEach(bed => {
                if(!wards[bed.ward_name]) wards[bed.ward_name] = [];
                wards[bed.ward_name].push(bed);
            });

            // Loop through each Ward and create a section
            for (const [wardName, wardBeds] of Object.entries(wards)) {

                let cardsHtml = '';

                wardBeds.forEach(bed => {
                    // Logic for Colors & Actions
                    let colorClass = 'success'; // Default Available
                    let statusText = 'Available';
                    let patientInfo = '<span class="text-muted small">--</span>';
                    let actionButton = `<a href="admissions.html" class="btn btn-sm btn-outline-success w-100 mt-2">Assign Patient</a>`;

                    if(bed.status === 'Occupied') {
                        colorClass = 'danger';
                        statusText = 'Occupied';
                        patientInfo = `<span class="fw-bold d-block text-truncate">${bed.patient_name || 'Unknown'}</span>
                                       <small class="text-muted">Admitted</small>`;
                        actionButton = `<button class="btn btn-sm btn-outline-danger w-100 mt-2" onclick="dischargePatient(${bed.id}, '${bed.bed_number}')">Discharge</button>`;
                    } else if (bed.status === 'Cleaning') {
                        colorClass = 'warning';
                        statusText = 'Cleaning';
                        patientInfo = '<span class="text-muted small fst-italic">Housekeeping...</span>';
                        actionButton = `<button class="btn btn-sm btn-outline-warning w-100 mt-2" onclick="markClean(${bed.id})">Mark Clean</button>`;
                    }

                    cardsHtml += `
                        <div class="col-md-3 col-sm-6">
                            <div class="bed-card h-100">
                                <div class="status-stripe bg-${colorClass}"></div>
                                <div class="d-flex justify-content-between mb-2">
                                    <span class="fw-bold">${bed.bed_number}</span>
                                    <span class="badge bg-${colorClass} bg-opacity-10 text-${colorClass}">${statusText}</span>
                                </div>
                                <div class="mb-3" style="min-height: 40px;">
                                    ${patientInfo}
                                </div>
                                ${actionButton}
                            </div>
                        </div>
                    `;
                });

                // Add Section to Page
                container.innerHTML += `
                    <div class="mb-5">
                        <h6 class="text-muted text-uppercase fw-bold mb-3 border-bottom pb-2">${wardName}</h6>
                        <div class="row g-3">
                            ${cardsHtml}
                        </div>
                    </div>
                `;
            }

        } else {
            container.innerHTML = '<div class="alert alert-info">No beds configured in the system.</div>';
        }
    }

    // --- ACTIONS ---

    async function dischargePatient(bedId, bedNum) {
        if(confirm(`Are you sure you want to discharge the patient from ${bedNum}?\nThis will mark the bed for cleaning.`)) {
            const res = await Api.post('/nurse/discharge', { bed_id: bedId });
            if(res) {
                // alert("✅ Patient discharged.");
                loadBeds(); // Refresh UI instantly
            }
        }
    }

    async function markClean(bedId) {
        const res = await Api.post('/nurse/mark_clean', { bed_id: bedId });
        if(res) {
            // alert("✨ Bed is now ready!");
            loadBeds(); // Refresh UI instantly
        }
    }
</script>
</body>
</html>
